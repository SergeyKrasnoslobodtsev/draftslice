[project]
name = "draftslice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image>=0.25.2",
    "onnxruntime-gpu==1.23.0 ; sys_platform == 'linux'",
    "onnxruntime==1.23.0 ; sys_platform == 'win32'",
    "skan>=0.13.1",
    "scikit-learn>=1.7.2",
]


[dependency-groups]
dev = [
    "pytest>=7.2",
    "pytest-asyncio>=0.20.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.8",
    "matplotlib>=3.9.4",
    "ipywidgets>=8.1.8",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
