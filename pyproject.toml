[project]
name = "draftslice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image>=0.25.2",
    "onnxruntime==1.23.0",
    "skan>=0.13.1",
    "scikit-learn>=1.7.2",
    "paddlepaddle-gpu==; sys_platform == 'linux'",
    "paddlepaddle; sys_platform == 'win32' or sys_platform == 'darwin'",
]


[dependency-groups]
dev = [
    "pytest>=7.2",
    "pytest-asyncio>=0.20.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.8",
    "matplotlib>=3.9.4",
    "ipywidgets>=8.1.8",
    "pandas>=2.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "tqdm>=4.68.3",
    "torchvision>=0.28.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle-gpu" }
paddlepaddle = { index = "paddlepaddle-cpu" }

[[tool.uv.index]]
name = "paddlepaddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
# модули стенда лежат рядом с блокнотами, тесты на них живут в test
pythonpath = ["notebooks"]
